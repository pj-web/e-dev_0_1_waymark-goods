<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <!-- Waymark Goods Logo — Dark version (for light backgrounds) -->
  <!-- Trail marker icon: stacked chevron / waymark blaze -->
  <g transform="translate(10, 16)">
    <path d="M10 38 L18 26 L26 38" fill="none" stroke="#3C3C3C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M10 46 L18 34 L26 46" fill="none" stroke="#C4653A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Wordmark: WAYMARK -->
  <text x="50" y="42" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#3C3C3C" text-anchor="start">WAYMARK</text>
  <!-- Submark: GOODS — aligned to start under wordmark -->
  <text x="50" y="61" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="5.5" fill="#8C8C8C" text-anchor="start">GOODS</text>
</svg>
